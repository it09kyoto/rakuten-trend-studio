<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>乐天流行趋势分析</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { color: #bf0000; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #bf0000; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: #333; color: #fff; text-decoration: none; border-radius: 4px; }
        .ai-box { color: #2c3e50; font-size: 0.9em; font-style: italic; color: #e67e22; }
    </style>
</head>
<body>

<a href="/" class="back-btn">← 返回搜索</a>
<h1>乐天市场实时流行趋势分析报告</h1>

<table>
    <thead>
    <tr>
        <th>排名</th>
        <th>商品名称</th>
        <th>价格 (参考)</th>
        <th>AI 选品建议 / 痛点分析</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p, iterStat : ${products}">
        <td th:text="${iterStat.count}">1</td>

        <td th:text="${p.name}">商品名称加载中...</td>

        <td th:text="${p.price}">价格加载中...</td>

        <td class="ai-box">
            <span th:text="${p.aiPrediction}">AI 正在分析该商品市场潜力...</span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
